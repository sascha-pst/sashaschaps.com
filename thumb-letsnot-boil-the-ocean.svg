<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="tt td">
  <title id="tt">The ocean shows up in the catch, years later</title>
  <desc id="td">Project title card: three offset waves over a row of warm and cool catch columns, marking the lag between an ocean year and the landings it produces.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122c38"/>
      <stop offset="1" stop-color="#0c1c24"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf87" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffcf87" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="630"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="630" fill="url(#sky)"/>
    <circle cx="1010" cy="150" r="320" fill="url(#sun)"/>

    <!-- catch columns: warm years red, cool years blue -->
    <g stroke-width="13" stroke-linecap="butt" opacity=".85">
      <g stroke="#3f6fa3">
        <line x1="92"  y1="596" x2="92"  y2="548"/>
        <line x1="128" y1="596" x2="128" y2="530"/>
        <line x1="164" y1="596" x2="164" y2="559"/>
        <line x1="272" y1="596" x2="272" y2="541"/>
        <line x1="308" y1="596" x2="308" y2="518"/>
        <line x1="344" y1="596" x2="344" y2="536"/>
        <line x1="524" y1="596" x2="524" y2="552"/>
        <line x1="560" y1="596" x2="560" y2="524"/>
        <line x1="704" y1="596" x2="704" y2="545"/>
        <line x1="740" y1="596" x2="740" y2="561"/>
        <line x1="920" y1="596" x2="920" y2="533"/>
        <line x1="956" y1="596" x2="956" y2="556"/>
        <line x1="1064" y1="596" x2="1064" y2="547"/>
      </g>
      <g stroke="#c0392b">
        <line x1="200" y1="596" x2="200" y2="512"/>
        <line x1="236" y1="596" x2="236" y2="538"/>
        <line x1="380" y1="596" x2="380" y2="527"/>
        <line x1="416" y1="596" x2="416" y2="497"/>
        <line x1="452" y1="596" x2="452" y2="521"/>
        <line x1="488" y1="596" x2="488" y2="543"/>
        <line x1="596" y1="596" x2="596" y2="505"/>
        <line x1="632" y1="596" x2="632" y2="529"/>
        <line x1="668" y1="596" x2="668" y2="486"/>
        <line x1="776" y1="596" x2="776" y2="514"/>
        <line x1="812" y1="596" x2="812" y2="539"/>
        <line x1="848" y1="596" x2="848" y2="502"/>
        <line x1="884" y1="596" x2="884" y2="531"/>
        <line x1="992" y1="596" x2="992" y2="509"/>
        <line x1="1028" y1="596" x2="1028" y2="534"/>
        <line x1="1100" y1="596" x2="1100" y2="516"/>
      </g>
    </g>
    <line x1="60" y1="596.5" x2="1140" y2="596.5" stroke="#2b4956" stroke-width="1"/>

    <!-- three waves, each shifted right of the one above: the lag, drawn -->
    <g fill="none" stroke-width="5" stroke-linecap="round">
      <path d="M-60 344 C 15 302, 90 386, 165 344 S 315 302, 390 344 S 540 302, 615 344 S 765 302, 840 344 S 990 302, 1065 344 S 1215 302, 1290 344"
            stroke="#99aba6" opacity=".95"/>
      <path d="M-20 404 C 55 362, 130 446, 205 404 S 355 362, 430 404 S 580 362, 655 404 S 805 362, 880 404 S 1030 362, 1105 404 S 1255 362, 1330 404"
            stroke="#acb090" opacity=".8"/>
      <path d="M20 464 C 95 422, 170 506, 245 464 S 395 422, 470 464 S 620 422, 695 464 S 845 422, 920 464 S 1070 422, 1145 464 S 1295 422, 1370 464"
            stroke="#6f6c43" opacity=".75"/>
    </g>

    <!-- lag bracket: the horizontal offset between the top and bottom wave -->
    <g stroke="#6f97a6" stroke-width="1.5" fill="none">
      <path d="M986 306 L986 292 L1074 292 L1074 306"/>
    </g>
    <text x="1030" y="280" text-anchor="middle" fill="#8fb4c1"
          font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="17" letter-spacing="2.4">LAG</text>

    <!-- type -->
    <text x="80" y="92" fill="#6f97a6"
          font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" letter-spacing="4.6">CALIFORNIA FISHERIES · 1980–2025</text>

    <g font-family="Fraunces, 'Playfair Display', Georgia, 'Times New Roman', serif"
       font-weight="600" font-size="70" fill="#ffffff" letter-spacing="-1.2">
      <text x="80" y="186">The ocean shows up</text>
      <text x="80" y="258">in the catch, <tspan fill="#ffcf87">years later</tspan>.</text>
    </g>

    <text x="80" y="622" fill="#4d6d7b"
          font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" letter-spacing="3.2">SASHA SCHAPS</text>
  </g>
</svg>
