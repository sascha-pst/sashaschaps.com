<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Four escalation stages listed in order: conversations, misinformation, conflict, crisis.">
  <defs>
    <linearGradient id="heat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8FC2B2"/>
      <stop offset="34%"  stop-color="#D7B855"/>
      <stop offset="67%"  stop-color="#DE8149"/>
      <stop offset="100%" stop-color="#D2596A"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="#0E1719"/>

  <text x="72" y="88"
        font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="21" letter-spacing="4.2" fill="#9DAFAB">WHITEPAPER SERIES</text>

  <rect x="72" y="145" width="6" height="380" rx="3" fill="url(#heat)"/>

  <g font-family="'Bricolage Grotesque', 'Helvetica Neue', Helvetica, Arial, sans-serif"
     font-weight="800" font-size="80" letter-spacing="-2.5">
    <text x="112" y="210" fill="#8FC2B2">Conversations</text>
    <text x="112" y="310" fill="#D7B855">Misinformation</text>
    <text x="112" y="410" fill="#DE8149">Conflict</text>
    <text x="112" y="510" fill="#D2596A">Crisis</text>
  </g>

  <text x="928" y="566" text-anchor="end"
        font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="20" letter-spacing="3" fill="#9DAFAB">4 PAPERS</text>
</svg>
