<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Four escalation stages listed in order: conversations, misinformation, conflict, crisis.">
  <defs>
    <linearGradient id="heat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6E9080"/>
      <stop offset="34%"  stop-color="#B08F45"/>
      <stop offset="67%"  stop-color="#BA7248"/>
      <stop offset="100%" stop-color="#AC5566"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="#ECEBE1"/>

  <text x="72" y="88"
        font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="21" letter-spacing="4.2" fill="#595C64">WHITEPAPER SERIES</text>

  <rect x="72" y="145" width="6" height="380" rx="3" fill="url(#heat)"/>

  <g font-family="'Bricolage Grotesque', 'Helvetica Neue', Helvetica, Arial, sans-serif"
     font-weight="800" font-size="80" letter-spacing="-2.5">
    <text x="112" y="210" fill="#6E9080">Conversations</text>
    <text x="112" y="310" fill="#B08F45">Misinformation</text>
    <text x="112" y="410" fill="#BA7248">Conflict</text>
    <text x="112" y="510" fill="#AC5566">Crisis</text>
  </g>

  <text x="928" y="566" text-anchor="end"
        font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="20" letter-spacing="3" fill="#595C64">4 PAPERS</text>
</svg>
