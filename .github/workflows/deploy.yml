name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Parse-check every script in every HTML file
        run: |
          node -e '
            const fs = require("fs");
            const { execFileSync } = require("child_process");
            let fail = 0, n = 0;
            for (const f of fs.readdirSync(".").filter(f => f.endsWith(".html"))) {
              const html = fs.readFileSync(f, "utf8");
              for (const [, attrs, js] of html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/g)) {
                if (/type\s*=\s*"(importmap|application\/(ld\+)?json)"/.test(attrs)) continue;
                const ext = /type\s*=\s*"module"/.test(attrs) ? "mjs" : "js";
                const tmp = `/tmp/check-${n++}.${ext}`;
                fs.writeFileSync(tmp, js);
                try { execFileSync("node", ["--check", tmp], { stdio: "pipe" }); }
                catch (e) { console.error(`${f} script #${n}: ${e.stderr}`); fail = 1; }
              }
            }
            if (fail) process.exit(1);
            console.log(`${n} scripts parse OK`);
          '

      - name: Build site (password gate optional)
        id: build
        env:
          STATICRYPT_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          mkdir -p dist
          if [ -n "$STATICRYPT_PASSWORD" ]; then
            echo "gated=true" >> "$GITHUB_OUTPUT"
            npx --yes staticrypt index.html -d dist --short --remember 7 \
              --template-title "sashaschaps.com" \
              --template-instructions "This studio is password protected. Enter the password to come in." \
              --template-button "Come in" \
              --template-placeholder "Password" \
              --template-color-primary "#2D6BD8" \
              --template-color-secondary "#FAFBFC"
          else
            echo "gated=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SITE_PASSWORD secret is not set — deploying the site publicly with no password gate."
            cp index.html dist/
          fi

      - name: Keep link previews working on the gate page
        if: steps.build.outputs.gated == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const p = "dist/index.html";
            const inject = [
              `<meta name="description" content="Sasha Schaps — data science and marbled porcelain.">`,
              `<meta property="og:title" content="Sasha Schaps — Data Science">`,
              `<meta property="og:description" content="Clay & code: data science projects and marbled porcelain.">`,
              `<meta property="og:image" content="https://sashaschaps.com/ogcard.jpg">`,
              `<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">`,
              `<meta name="twitter:card" content="summary_large_image">`,
              `<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=\x27http://www.w3.org/2000/svg\x27 viewBox=\x270 0 64 64\x27%3E%3Ccircle cx=\x2745\x27 cy=\x2718\x27 r=\x276\x27 fill=\x27%238FBFE0\x27/%3E%3Cpath d=\x27M6 41c8-9 17-9 25-2s17 7 27-2\x27 fill=\x27none\x27 stroke=\x27%232D6BD8\x27 stroke-width=\x275\x27 stroke-linecap=\x27round\x27/%3E%3C/svg%3E">`,
              `</head>`
            ].join("\n");
            fs.writeFileSync(p, fs.readFileSync(p, "utf8").replace("</head>", inject));
            console.log("OG tags + favicon injected into gate page");
          '

      - name: Copy public assets
        run: cp ogcard.jpg heroposter.jpg dist/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
