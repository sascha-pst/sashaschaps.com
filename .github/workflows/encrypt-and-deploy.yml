name: Build, encrypt, and deploy site

on:
  push:
    branches: [main]        
  workflow_dispatch:      

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-encrypt-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build the Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Set up Node (for staticrypt)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Encrypt all HTML pages with staticrypt
        env:
          STATICRYPT_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          sudo chown -R $USER:$USER ./_site
          npx staticrypt ./_site -r -d ./encrypted \
            --password "$STATICRYPT_PASSWORD" \
            --short \
            --remember 7 \
            --template-title "sashaschaps.com" \
            --template-instructions "This site is password protected. Enter the password to continue."

      - name: Upload encrypted site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./encrypted

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
