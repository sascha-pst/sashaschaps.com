title: Sasha Schaps
tagline: Writing, research, and creative work.
description: >-
  Personal site of Sasha Schaps — blog, portfolio, resume, and contact.
author: Sasha Schaps
email: hello@sashaschaps.com
url: "https://sashaschaps.com"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:slug/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections — modular blog (folder-per-post) + portfolio split into brands & projects
collections:
  blog:
    output: true
    permalink: /blog/:path/
  brands:
    output: true
    permalink: /portfolio/brands/:path/
  projects:
    output: true
    permalink: /portfolio/projects/:path/

defaults:
  - scope:
      path: ""
      type: blog
    values:
      layout: post
  - scope:
      path: ""
      type: brands
    values:
      layout: portfolio-item
      kind: brand
  - scope:
      path: ""
      type: projects
    values:
      layout: portfolio-item
      kind: project
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md

# Navigation — drives the header menu in _includes/nav.html
nav:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: Blog
    url: /blog/
  - title: Portfolio
    url: /portfolio/
  - title: Resume
    url: /resume/
  - title: Contact
    url: /contact/
