<article class="card post-card">
  {% if include.post.cover %}
    <a class="card-image" href="{{ include.post.url | relative_url }}">
      <img src="{{ include.post.cover | relative_url }}" alt="{{ include.post.cover_alt | default: include.post.title }}" loading="lazy">
    </a>
  {% endif %}
  <div class="card-body">
    <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
    {% if include.post.date %}<p class="card-meta"><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%B %-d, %Y" }}</time></p>{% endif %}
    {% if include.post.excerpt_text %}<p>{{ include.post.excerpt_text }}</p>{% endif %}
  </div>
</article>
