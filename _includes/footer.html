<footer class="site-footer">
  <div class="wrap site-footer-inner">
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.author }}.</p>
    <ul class="social">
      {% if site.email %}<li><a href="mailto:{{ site.email }}">Email</a></li>{% endif %}
      {% if site.github %}<li><a href="https://github.com/{{ site.github }}" rel="noopener">GitHub</a></li>{% endif %}
      {% if site.linkedin %}<li><a href="https://linkedin.com/in/{{ site.linkedin }}" rel="noopener">LinkedIn</a></li>{% endif %}
      <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
    </ul>
  </div>
</footer>
