<header class="site-header">
  <div class="wrap site-header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Primary">
      <input type="checkbox" id="nav-toggle" class="nav-toggle">
      <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle menu"><span></span></label>
      <ul>
        {% for item in site.nav %}
          {% assign current = false %}
          {% if page.url == item.url %}{% assign current = true %}{% endif %}
          {% if item.url != '/' and page.url contains item.url %}{% assign current = true %}{% endif %}
          <li{% if current %} class="active"{% endif %}><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
