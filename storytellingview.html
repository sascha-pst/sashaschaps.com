document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {

    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; 

      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {};
    const pendingRelays = {};
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;

      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; 
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {

        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {

          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');

    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-appearance:none;appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff6df,#ffcf87 55%,#ff9d52);box-shadow:0 0 0 4px rgba(255,207,135,.22),0 0 16px rgba(255,157,82,.65);border:none;transition:box-shadow .15s;}\n  input[type=range].ocean-slider:active::-webkit-slider-thumb{box-shadow:0 0 0 6px rgba(255,207,135,.28),0 0 22px rgba(255,157,82,.8);}\n  input[type=range].ocean-slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff6df,#ffcf87 55%,#ff9d52);box-shadow:0 0 0 4px rgba(255,207,135,.22),0 0 16px rgba(255,157,82,.65);border:none;}\n<\/style>\n<\/helmet>\n\n<div style=\"background:#eef3f4;color:#10222b;font-family:'Public Sans',system-ui,sans-serif;font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;\">\n\n  <!-- ============ HERO ============ -->\n  <header style=\"min-height:92vh;background:#0c1c24;color:#eaf2f4;display:flex;flex-direction:column;justify-content:center;padding:64px 24px 72px;position:relative;overflow:hidden;\">\n    <canvas ref=\"{{ heroOceanRef }}\" style=\"position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block;\"><\/canvas>\n    <div style=\"position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(12,28,36,.5) 0%,rgba(12,28,36,.18) 38%,rgba(12,28,36,.35) 62%,rgba(12,28,36,.82) 100%);pointer-events:none;\"><\/div>\n    <div style=\"max-width:1000px;margin:0 auto;width:100%;position:relative;z-index:2;\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#6f97a6;display:block;margin-bottom:26px;\">California Fisheries · 1980–2025<\/span>\n      <h1 style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(40px,7vw,88px);line-height:1.02;letter-spacing:-.02em;margin:0;max-width:16ch;color:#fff;\">The ocean shows up in the catch, years later.<\/h1>\n      <p style=\"font-size:clamp(18px,2.4vw,23px);line-height:1.5;color:#b9cbd2;max-width:60ch;margin:30px 0 0;\">Along the California coast, a single warm or cool year at sea sets the fate of a generation of fish long before any of them reach a boat. That ocean signal moves up through the food web on its own timeline and surfaces in the landings record years down the line. Scroll to follow it.<\/p>\n      <div style=\"margin-top:46px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#6f97a6;display:flex;align-items:center;gap:12px;\">\n        <span style=\"width:1px;height:34px;background:#3a5560;display:inline-block;\"><\/span>\n        Scroll to begin\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <!-- ============ METHODS / GLOSSARY (intro) ============ -->\n  <section style=\"background:#0c1c24;color:#b9cbd2;padding:64px 24px 72px;border-top:1px solid #1c3540;\">\n    <div style=\"max-width:820px;margin:0 auto;\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#6f97a6;display:block;margin-bottom:18px;\">How to read this<\/span>\n      <h2 style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:28px;line-height:1.15;margin:0 0 26px;color:#fff;\">The fine print, first.<\/h2>\n      <dl style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;margin:0;\">\n        <div>\n          <dt style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#eaf2f4;font-weight:600;margin-bottom:5px;\">Z-score<\/dt>\n          <dd style=\"margin:0;font-size:14.5px;line-height:1.5;\">A way of putting very different things on one scale. We express each year as how far it sits above or below that series’ own long-run average, so pounds of fish and ocean temperature can be read side by side. Zero is an ordinary year.<\/dd>\n        <\/div>\n        <div>\n          <dt style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#eaf2f4;font-weight:600;margin-bottom:5px;\">Lag<\/dt>\n          <dd style=\"margin:0;font-size:14.5px;line-height:1.5;\">The time we allow between an ocean condition and the catch we compare it to. At a 4-year lag, this year’s catch is set beside the ocean of four years earlier, roughly how long many species take to grow into a fishery.<\/dd>\n        <\/div>\n        <div>\n          <dt style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#eaf2f4;font-weight:600;margin-bottom:5px;\">Correlation (r)<\/dt>\n          <dd style=\"margin:0;font-size:14.5px;line-height:1.5;\">Pearson’s r, running from −1 to +1, for how closely two records rise and fall together. It points to a relationship worth studying; it is not, on its own, proof that the ocean caused the catch.<\/dd>\n        <\/div>\n        <div>\n          <dt style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#eaf2f4;font-weight:600;margin-bottom:5px;\">Warm- / cold-water signal<\/dt>\n          <dd style=\"margin:0;font-size:14.5px;line-height:1.5;\">Whether a fishery tends to land more in warmer years (a positive signal) or in cooler ones (negative), measured at the lag where the relationship is strongest. It hints at the conditions each species is built for.<\/dd>\n        <\/div>\n      <\/dl>\n      <p style=\"margin:34px 0 0;font-size:13px;color:#6f97a6;line-height:1.6;max-width:70ch;\">Catch data: California commercial landings, 1980–2025. Ocean index derived from northeastern Pacific conditions. Species biology from NOAA’s California Current climate vulnerability assessments. Correlations are lagged Pearson’s r across 44–46 years per species. A correlation points to a relationship, not a cause: the ocean is one influence among many, alongside management, markets, and fishing effort. Treat what follows as a starting point for closer study, not a verdict.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- ============ SECTION 1 — TWO LINES ============ -->\n  <section style=\"padding:88px 24px 40px;\">\n    <div style=\"max-width:680px;margin:0 auto;\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#5b6e75;display:block;margin-bottom:18px;\">01 &nbsp;·&nbsp; Two records<\/span>\n      <h2 style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1.12;letter-spacing:-.01em;margin:0 0 20px;\">Every fishery keeps a record. So does the ocean.<\/h2>\n      <p style=\"margin:0 0 20px;\">California’s landings data tells us how much of each species came ashore, year by year. Some years are abundant, some lean. Below is the northern anchovy, a small, cool-water forage fish near the base of the food web, shown as a <strong>z-score<\/strong>: how far each year’s catch sat above or below its own long-run average.<\/p>\n      <p style=\"margin:0 0 20px;\">The ocean keeps a record too. The <strong>columns<\/strong> show how warm or cool the northeastern Pacific ran that year: <span style=\"color:#c0392b;font-weight:600;\">red for warmer than usual<\/span>, <span style=\"color:#3f6fa3;font-weight:600;\">blue for cooler<\/span>. Set them beside the catch in the <em>same<\/em> year, and the two records barely track each other.<\/p>\n    <\/div>\n    <figure style=\"max-width:960px;margin:34px auto 0;padding:0 8px;\">\n      <div style=\"background:#fff;border:1px solid #d3dde0;border-radius:12px;padding:18px 18px 12px;box-shadow:0 1px 2px rgba(16,34,43,.05),0 18px 40px -28px rgba(16,34,43,.4);\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:#5b6e75;margin-bottom:6px;\">NORTHERN ANCHOVY · CATCH vs. OCEAN, SAME YEAR (LAG 0)<\/div>\n        <div style=\"width:100%;\">{{ introChart }}<\/div>\n        <div style=\"display:flex;flex-wrap:wrap;gap:18px;margin-top:8px;font-size:13px;color:#3d545e;\">\n          <span style=\"display:inline-flex;align-items:center;gap:7px;\"><span style=\"width:13px;height:13px;background:#c0392b;border-radius:3px;display:inline-block;\"><\/span>warmer ocean year<\/span>\n          <span style=\"display:inline-flex;align-items:center;gap:7px;\"><span style=\"width:13px;height:13px;background:#3f6fa3;border-radius:3px;display:inline-block;\"><\/span>cooler ocean year<\/span>\n          <span style=\"display:inline-flex;align-items:center;gap:7px;\"><span style=\"width:22px;height:3px;background:#1c3a45;border-radius:2px;display:inline-block;\"><\/span>anchovy catch (z-score)<\/span>\n        <\/div>\n      <\/div>\n    <\/figure>\n  <\/section>\n\n  <!-- ============ SECTION 2 — THE LAG IDEA ============ -->\n  <section style=\"padding:56px 24px 24px;\">\n    <div style=\"max-width:680px;margin:0 auto;\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#5b6e75;display:block;margin-bottom:18px;\">02 &nbsp;·&nbsp; The trick is time<\/span>\n      <h2 style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1.12;letter-spacing:-.01em;margin:0 0 20px;\">A fish spawned this year won’t reach a boat until it has grown.<\/h2>\n      <p style=\"margin:0 0 20px;\">The ocean does its most important work at the <em>beginning<\/em> of a life, deciding whether a year’s eggs, larvae, and juveniles survive their first warm or cool season. Those survivors won’t enter the fishery until they’re large enough to be caught, and depending on the species that can take anywhere from one year to several.<\/p>\n      <p style=\"margin:0 0 20px;\">So the fair comparison isn’t this year’s catch against this year’s ocean. It’s this year’s catch against the ocean of a few years <strong>earlier<\/strong>, when today’s catch was just beginning. Shift the ocean columns back in time, and the two records start to line up.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- ============ STICKY SCROLLY — THE LAG APPEARS ============ -->\n  <section style=\"position:relative;min-height:360vh;\" ref=\"{{ stickyRef }}\">\n    <div style=\"position:sticky;top:0;height:100vh;display:flex;align-items:center;background:#eef3f4;\">\n      <div style=\"max-width:1100px;margin:0 auto;width:100%;padding:0 24px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(240px,1fr);gap:34px;align-items:center;\">\n        <figure style=\"margin:0;\">\n          <div style=\"background:#fff;border:1px solid #d3dde0;border-radius:12px;padding:18px 18px 12px;box-shadow:0 1px 2px rgba(16,34,43,.05),0 18px 40px -28px rgba(16,34,43,.4);\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:#5b6e75;margin-bottom:6px;\">NORTHERN ANCHOVY · OCEAN SLID BACK {{ stickLag }} YEAR(S)<\/div>\n            <div style=\"width:100%;\">{{ stickyChart }}<\/div>\n            <div style=\"display:flex;flex-wrap:wrap;gap:18px;margin-top:8px;font-size:12.5px;color:#3d545e;\">\n              <span style=\"display:inline-flex;align-items:center;gap:7px;\"><span style=\"width:12px;height:12px;background:#c0392b;border-radius:3px;display:inline-block;\"><\/span>warmer<\/span>\n              <span style=\"display:inline-flex;align-items:center;gap:7px;\"><span style=\"width:12px;height:12px;background:#3f6fa3;border-radius:3px;display:inline-block;\"><\/span>cooler<\/span>\n              <span style=\"display:inline-flex;align-items:center;gap:7px;\"><span style=\"width:20px;height:3px;background:#1c3a45;border-radius:2px;display:inline-block;\"><\/span>catch<\/span>\n            <\/div>\n          <\/div>\n        <\/figure>\n        <div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5b6e75;\">Lag<\/div>\n          <div style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:76px;line-height:1;letter-spacing:-.03em;\">{{ stickLag }}<span style=\"font-size:26px;color:#5b6e75;font-weight:500;margin-left:6px;\">yr<\/span><\/div>\n          <div style=\"margin-top:22px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5b6e75;\">Correlation (r)<\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:46px;line-height:1;letter-spacing:-.02em;color:{{ stickRColor }};\">{{ stickR }}<\/div>\n          <p style=\"margin:18px 0 0;font-size:16px;line-height:1.5;color:#3d545e;max-width:30ch;\">{{ stickDesc }}<\/p>\n          <sc-if value=\"{{ stickPeak }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;display:inline-block;background:#0c1c24;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;padding:7px 12px;border-radius:999px;\">↑ strongest match<\/div>\n            <p style=\"margin:12px 0 0;font-size:13px;line-height:1.55;color:#7a6a4f;background:#f6efdf;border:1px solid #e4d7b8;border-radius:8px;padding:10px 12px;max-width:34ch;\"><strong>A biological caveat:<\/strong> seven years is longer than a northern anchovy lives &mdash; few survive past age 4, and most are caught at 1&ndash;2. So this statistical peak can&rsquo;t be a simple spawn-to-boat delay for one generation. It more plausibly reflects slow, multi-year ocean regimes shaping several generations in a row &mdash; or chance in a short, autocorrelated record. The biologically expected lag is 1&ndash;2 years.<\/p>\n          <\/sc-if>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ============ SECTION 3 — MANUAL RULER ============ -->\n  <section style=\"padding:80px 24px 40px;background:#0c1c24;color:#eaf2f4;position:relative;overflow:hidden;\">\n    <canvas ref=\"{{ bandOceanRef }}\" style=\"position:absolute;top:0;left:0;width:100%;height:440px;z-index:0;display:block;\"><\/canvas>\n    <div style=\"position:absolute;top:0;left:0;width:100%;height:440px;z-index:0;background:linear-gradient(180deg,rgba(12,28,36,.3),rgba(12,28,36,.1) 42%,#0c1c24 100%);pointer-events:none;\"><\/div>\n    <div style=\"max-width:680px;margin:0 auto;position:relative;z-index:1;\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#6f97a6;display:block;margin-bottom:18px;\">03 &nbsp;·&nbsp; Any species, any lag<\/span>\n      <h2 style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1.12;letter-spacing:-.01em;margin:0 0 20px;color:#fff;\">Every fishery has its own delay.<\/h2>\n      <p style=\"margin:0 0 8px;color:#b9cbd2;\">Choose a species and slide the lag. Watch the correlation respond as you shift the ocean back through time. Each fishery has its own best lag, and its own preference: some do well in warm years, others in cool. That is what a species’ biology looks like in the landings record.<\/p>\n    <\/div>\n    <div style=\"max-width:960px;margin:30px auto 0;position:relative;z-index:1;\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center;\">\n        <sc-for list=\"{{ species }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <button type=\"button\" sc-camel-on-click=\"{{ s.onClick }}\" style=\"{{ s.style }}\">{{ s.label }}<\/button>\n        <\/sc-for>\n        <span style=\"color:#6f97a6;font-size:13px;\">or pick any of the 76:<\/span>\n        <sc-raw-select value=\"{{ heroName }}\" sc-camel-on-change=\"{{ onHeroPick }}\" style=\"padding:8px 12px;border:1px solid #274049;border-radius:999px;background-color:#12242d;color:#eaf2f4;font-size:14px;cursor:pointer;min-width:210px;\">\n          <sc-for list=\"{{ allNames }}\" as=\"nm\" hint-placeholder-count=\"8\">\n            <option value=\"{{ nm }}\">{{ nm }}<\/option>\n          <\/sc-for>\n        <\/sc-raw-select>\n      <\/div>\n      <div style=\"background:#12242d;border:1px solid #274049;border-radius:14px;padding:22px 22px 18px;\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:26px;align-items:start;\">\n          <div style=\"min-width:0;\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:#8fb0bc;margin-bottom:6px;\">{{ heroLabel }} · CATCH vs. OCEAN −{{ heroLag }}YR<\/div>\n            <div style=\"width:100%;\">{{ heroChart }}<\/div>\n            <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:9px;font-size:11.5px;color:#8fb0bc;\">\n              <span style=\"display:inline-flex;align-items:center;gap:6px;\"><span style=\"width:11px;height:11px;border-radius:2px;background:#c0392b;opacity:.72;display:inline-block;\"><\/span>Warm &middot; El Ni&ntilde;o-leaning<\/span>\n              <span style=\"display:inline-flex;align-items:center;gap:6px;\"><span style=\"width:11px;height:11px;border-radius:2px;background:#3f6fa3;opacity:.72;display:inline-block;\"><\/span>Cool &middot; La Ni&ntilde;a-leaning<\/span>\n              <span>bars = RONI<\/span>\n              <span style=\"display:inline-flex;align-items:center;gap:6px;\"><span style=\"width:16px;height:3px;border-radius:2px;background:#eaf2f4;display:inline-block;\"><\/span>line = landings<\/span>\n            <\/div>\n            <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid #274049;\">\n              <div><div style=\"font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#6f97a6;margin-bottom:2px;\">Peak landings<\/div><div style=\"font-size:15px;font-weight:600;color:#eaf2f4;\">{{ heroPeak }}<\/div><div style=\"font-size:10.5px;color:#6f97a6;\">{{ heroPeakYear }}<\/div><\/div>\n              <div><div style=\"font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#6f97a6;margin-bottom:2px;\">Latest<\/div><div style=\"font-size:15px;font-weight:600;color:#eaf2f4;\">{{ heroLast }}<\/div><div style=\"font-size:10.5px;color:#6f97a6;\">{{ heroLastYear }}<\/div><\/div>\n              <div><div style=\"font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#6f97a6;margin-bottom:2px;\">Total value, 1980&ndash;2025<\/div><div style=\"font-size:15px;font-weight:600;color:#eaf2f4;\">{{ heroTotalVal }}<\/div><div style=\"font-size:10.5px;color:#6f97a6;\">nominal dollars<\/div><\/div>\n            <\/div>\n            <sc-if value=\"{{ heroHasCva }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:12px;padding-top:12px;border-top:1px solid #274049;\">\n                <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;\">\n                  <span style=\"font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#6f97a6;\">Expert CVA sensitivity<\/span>\n                  <span style=\"font-size:20px;font-weight:600;color:{{ heroCvaColor }};\">{{ heroCva }}<\/span>\n                  <span style=\"font-size:12.5px;color:{{ heroCvaColor }};\">{{ heroCvaBand }}<\/span>\n                  <span style=\"font-size:12px;font-style:italic;color:#6f97a6;\">{{ heroSci }}<\/span>\n                <\/div>\n                <p style=\"margin:7px 0 0;font-size:12.5px;line-height:1.5;color:#9db8c2;\">{{ heroRange }}<\/p>\n              <\/div>\n            <\/sc-if>\n            <sc-if value=\"{{ heroNoCva }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:12px;padding-top:12px;border-top:1px solid #274049;font-size:12.5px;color:#6f97a6;\">Federally managed &mdash; no California state CVA score for this species.<\/div>\n            <\/sc-if>\n          <\/div>\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8fb0bc;\">Lag (years)<\/div>\n            <div style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:52px;line-height:1;letter-spacing:-.02em;color:#fff;margin:2px 0 10px;\">{{ heroLag }}<\/div>\n            <input type=\"range\" class=\"ocean-slider\" min=\"0\" max=\"10\" step=\"1\" value=\"{{ heroLag }}\" sc-camel-on-input=\"{{ onLag }}\" sc-camel-on-change=\"{{ onLag }}\" style=\"width:100%;\">\n            <div style=\"display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6f97a6;margin-top:2px;\"><span>0<\/span><span>10<\/span><\/div>\n            <div style=\"margin-top:20px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8fb0bc;\">Correlation r<\/div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;line-height:1;color:{{ heroRColor }};\">{{ heroR }}<\/div>\n            <p style=\"margin:12px 0 0;font-size:13.5px;line-height:1.5;color:#b9cbd2;\">{{ heroDesc }}<\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ============ INTERLUDE — TRAWL THE NET ============ -->\n  <section style=\"padding:80px 24px 64px;background:#071720;color:#eaf2f4;position:relative;overflow:hidden;\">\n    <div style=\"max-width:680px;margin:0 auto 26px;position:relative;z-index:2;\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#6f97a6;display:block;margin-bottom:18px;\">◇ Interlude &nbsp;·&nbsp; Ring the school<\/span>\n      <h2 style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1.12;letter-spacing:-.01em;margin:0 0 20px;color:#fff;\">Draw the net around the school.<\/h2>\n      <p style=\"margin:0 0 8px;color:#b9cbd2;\">Meet market squid, California’s largest fishery by volume, drawn here from its own data. These squid aren’t trawled. Seiners work at night, using bright deck lights to gather a spawning school, then encircle it with a purse seine. Sweep the mesh around the squid to see how it works. And remember: a strong season like this one traces back to the ocean the year <em>before<\/em>. Squid live fast and respond to the sea on about a one-year lag.<\/p>\n    <\/div>\n    <div style=\"max-width:1000px;margin:0 auto;position:relative;z-index:2;\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:14px;\">\n        <div style=\"display:flex;gap:22px;align-items:baseline;\">\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6f97a6;\">Caught<\/div>\n            <div ref=\"{{ trawlCountRef }}\" style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:46px;line-height:1;color:#ffcf87;\">0<\/div>\n          <\/div>\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6f97a6;\">Driven by ocean<\/div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:20px;color:#7fb0c4;\">−1 yr · cool water<\/div>\n          <\/div>\n        <\/div>\n        <button type=\"button\" sc-camel-on-click=\"{{ onTrawlReset }}\" style=\"border:1px solid #274049;background:#0d222c;border-radius:999px;padding:8px 16px;font:500 13px 'Public Sans',sans-serif;color:#9db8c2;cursor:pointer;\">Release the catch<\/button>\n      <\/div>\n      <div style=\"border:1px solid #163241;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#0a2230,#04121a);box-shadow:inset 0 2px 30px rgba(0,0,0,.4);\">\n        <canvas ref=\"{{ trawlRef }}\" style=\"display:block;width:100%;height:520px;touch-action:none;cursor:grab;\"><\/canvas>\n      <\/div>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#5b6e75;margin-top:10px;\">Drag anywhere on the mesh to draw the seine · squid ringed in the net ride with it<\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ============ SECTION 4 — SPOTLIGHTS ============ -->\n  <section style=\"padding:88px 24px 40px;\">\n    <div style=\"max-width:680px;margin:0 auto;\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#5b6e75;display:block;margin-bottom:18px;\">04 &nbsp;·&nbsp; Four fisheries, four delays<\/span>\n      <h2 style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1.12;letter-spacing:-.01em;margin:0 0 20px;\">The lag is not one number. It is specific to each species.<\/h2>\n      <p style=\"margin:0 0 8px;\">Every species responds to the ocean on its own timeline, shaped by how it lives, breeds, and grows. Here are four of California’s most familiar fisheries, each shown at the lag where its catch and the ocean line up most closely.<\/p>\n    <\/div>\n    <div style=\"max-width:1000px;margin:32px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;\">\n      <sc-for list=\"{{ spots }}\" as=\"sp\" hint-placeholder-count=\"4\">\n        <article style=\"background:#fff;border:1px solid #d3dde0;border-radius:12px;padding:18px 18px 16px;box-shadow:0 1px 2px rgba(16,34,43,.05);display:flex;flex-direction:column;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;\">\n            <span style=\"{{ sp.tagStyle }}\">{{ sp.tagText }}<\/span>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5b6e75;\">lag {{ sp.lag }} yr<\/span>\n          <\/div>\n          <h3 style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:21px;line-height:1.15;margin:12px 0 2px;\">{{ sp.short }}<\/h3>\n          <div style=\"font-style:italic;color:#5b6e75;font-size:13.5px;margin-bottom:12px;\">{{ sp.sci }}<\/div>\n          <div style=\"margin:0 0 12px;\">{{ sp.spark }}<\/div>\n          <p style=\"margin:0;font-size:14px;line-height:1.5;color:#3d545e;flex:1;\">{{ sp.blurb }}<\/p>\n          <div style=\"margin-top:14px;padding-top:12px;border-top:1px solid #e6edef;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5b6e75;display:flex;justify-content:space-between;\">\n            <span>best r<\/span><span style=\"color:{{ sp.rColor }};font-weight:600;\">{{ sp.r }}<\/span>\n          <\/div>\n        <\/article>\n      <\/sc-for>\n    <\/div>\n  <\/section>\n\n  <!-- ============ SECTION 4B — COMPARE ECHOES ============ -->\n  <section style=\"padding:64px 24px 40px;background:#f5f8f8;\">\n    <div style=\"max-width:680px;margin:0 auto;\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#5b6e75;display:block;margin-bottom:18px;\">04½ &nbsp;·&nbsp; Side by side<\/span>\n      <h2 style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1.12;letter-spacing:-.01em;margin:0 0 20px;\">Compare the curves directly.<\/h2>\n      <p style=\"margin:0 0 8px;\">Each line follows how closely a fishery’s catch tracks the ocean at every lag from 0 to 10 years. The point furthest from zero is that species’ best lag. Compare a few and the differences stand out: squid respond within a year, Dungeness crab and California halibut take about five, and warm- and cold-water species curve in opposite directions.<\/p>\n    <\/div>\n    <div style=\"max-width:900px;margin:26px auto 0;\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center;\">\n        <sc-raw-select value=\"{{ heroName }}\" sc-camel-on-change=\"{{ onCompareAdd }}\" style=\"padding:8px 12px;border:1px solid #cdd8db;border-radius:999px;background-color:#fff;font-size:14px;cursor:pointer;min-width:200px;\">\n          <sc-for list=\"{{ allNames }}\" as=\"nm\" hint-placeholder-count=\"8\">\n            <option value=\"{{ nm }}\">{{ nm }}<\/option>\n          <\/sc-for>\n        <\/sc-raw-select>\n        <sc-for list=\"{{ compareChips }}\" as=\"ch\" hint-placeholder-count=\"4\">\n          <button type=\"button\" sc-camel-on-click=\"{{ ch.onClick }}\" style=\"{{ ch.style }}\"><span style=\"width:11px;height:11px;border-radius:3px;display:inline-block;background:{{ ch.dot }};margin-right:8px;vertical-align:middle;opacity:{{ ch.dotOpacity }};\"><\/span>{{ ch.label }}<\/button>\n        <\/sc-for>\n      <\/div>\n      <div style=\"background:#fff;border:1px solid #d3dde0;border-radius:12px;padding:20px 20px 14px;box-shadow:0 1px 2px rgba(16,34,43,.05),0 18px 40px -28px rgba(16,34,43,.4);\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:#5b6e75;margin-bottom:6px;\">CORRELATION r vs. LAG · COMMERCIAL LANDINGS<\/div>\n        <div style=\"width:100%;\">{{ compareChart }}<\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ============ SECTION 5 — RANKING ============ -->\n  <section style=\"padding:64px 24px 40px;\">\n    <div style=\"max-width:680px;margin:0 auto;\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#5b6e75;display:block;margin-bottom:18px;\">05 &nbsp;·&nbsp; The whole fleet<\/span>\n      <h2 style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1.12;letter-spacing:-.01em;margin:0 0 20px;\">Most of California’s catch is tracking a warming sea.<\/h2>\n      <p style=\"margin:0 0 20px;\">Give every species its <em>best<\/em> lag, then measure how closely its catch follows the ocean. A longer bar means a clearer signal, not a larger fishery. Of the 76 fisheries with a usable record, <strong style=\"color:#c0392b;\">58 land more in warmer years<\/strong> and <strong style=\"color:#3f6fa3;\">18 in cooler ones<\/strong>. That balance is what a warming California Current would be expected to shift. The four spotlighted species are marked.<\/p>\n    <\/div>\n    <figure style=\"max-width:900px;margin:26px auto 0;\">\n      <div style=\"background:#fff;border:1px solid #d3dde0;border-radius:12px;padding:20px 20px 14px;box-shadow:0 1px 2px rgba(16,34,43,.05),0 18px 40px -28px rgba(16,34,43,.4);\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:12px;\">\n          <div style=\"display:flex;gap:16px;font-size:13px;color:#3d545e;\">\n            <span style=\"display:inline-flex;align-items:center;gap:7px;\"><span style=\"width:13px;height:13px;background:#c0392b;border-radius:3px;display:inline-block;\"><\/span>warm-water<\/span>\n            <span style=\"display:inline-flex;align-items:center;gap:7px;\"><span style=\"width:13px;height:13px;background:#3f6fa3;border-radius:3px;display:inline-block;\"><\/span>cold-water<\/span>\n          <\/div>\n          <button type=\"button\" sc-camel-on-click=\"{{ onRankToggle }}\" style=\"border:1px solid #d3dde0;background:#fbfdfd;border-radius:999px;padding:6px 14px;font:500 13px 'Public Sans',sans-serif;color:#10222b;cursor:pointer;\">{{ rankToggleLabel }}<\/button>\n        <\/div>\n        <div style=\"width:100%;\">{{ rankChart }}<\/div>\n      <\/div>\n    <\/figure>\n  <\/section>\n\n\n  <!-- ============ SECTION 5B — EXPERT BENCHMARK ============ -->\n  <section style=\"padding:64px 24px 40px;background:#f5f8f8;\">\n    <div style=\"max-width:760px;margin:0 auto;\">\n      <h2 style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1.12;letter-spacing:-.01em;margin:0 0 20px;\">Do expert vulnerability scores predict the measured signal?<\/h2>\n      <p style=\"margin:0 0 8px;\">Marine scientists rated 34 California state-managed species on how biologically sensitive each one is to a changing climate, judging things like temperature tolerance, larval survival and habitat specificity. Nineteen of them appear in this catch record. If those expert judgements capture something real about how a fishery responds, the species scored most sensitive should be the ones whose catch tracks RONI most tightly. Each dot below is one species: its expert score across, its measured signal up.<\/p>\n    <\/div>\n    <figure style=\"max-width:900px;margin:26px auto 0;\">\n      <div style=\"background:#fff;border:1px solid #d3dde0;border-radius:14px;padding:20px 20px 14px;\">\n        <div style=\"width:100%;\">{{ benchChart }}<\/div>\n        <p style=\"margin:10px 0 0;font-size:13.5px;line-height:1.55;color:#3d545e;\">Across-species correlation: <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:700;color:{{ benchColor }};\">{{ benchR }}<\/span> over {{ benchN }} species. {{ benchVerdict }}<\/p>\n        <p style=\"margin:8px 0 0;font-size:12px;line-height:1.5;color:#8a9aa0;\">{{ cvaCoverage }}. Expert scores come from the California state Climate Vulnerability Assessment (Frawley et al. 2025). A flat cloud here is a real result, not a broken chart: expert vulnerability and measured climate association are different measurements, and a catch record carries fishing effort, quota and market shifts that no biological score tries to predict. Click any dot to load that species above.<\/p>\n      <\/div>\n    <\/figure>\n  <\/section>\n\n  <!-- ============ SECTION 6 — TABLE ============ -->\n  <section style=\"padding:56px 24px 40px;\">\n    <div style=\"max-width:680px;margin:0 auto;\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#5b6e75;display:block;margin-bottom:18px;\">06 &nbsp;·&nbsp; Every species<\/span>\n      <h2 style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1.12;letter-spacing:-.01em;margin:0 0 16px;\">The full record.<\/h2>\n      <p style=\"margin:0 0 18px;\">Every species, with its best lag and correlation across three measures of the fishery. Search for one you know, or click any column to sort.<\/p>\n    <\/div>\n    <div style=\"max-width:900px;margin:0 auto;\">\n      <input type=\"text\" placeholder=\"Search species…\" value=\"{{ query }}\" sc-camel-on-input=\"{{ onSearch }}\" style=\"width:100%;padding:12px 14px;font:500 15px 'Public Sans',sans-serif;border:1px solid #d3dde0;border-radius:9px;background:#fff;margin-bottom:14px;\">\n      <div style=\"background:#fff;border:1px solid #d3dde0;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(16,34,43,.05);\">\n        <div style=\"overflow-x:auto;\">\n          <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:14px;min-width:640px;\">\n            <sc-raw-thead>\n              <sc-raw-tr>\n                <sc-raw-th sc-camel-on-click=\"{{ sort.name }}\" style=\"text-align:left;padding:12px 14px;border-bottom:1px solid #e6edef;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#5b6e75;cursor:pointer;\">Species {{ sortMark.name }}<\/sc-raw-th>\n                <sc-raw-th sc-camel-on-click=\"{{ sort.lag }}\" style=\"text-align:right;padding:12px 14px;border-bottom:1px solid #e6edef;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#5b6e75;cursor:pointer;\">Landings lag {{ sortMark.lag }}<\/sc-raw-th>\n                <sc-raw-th sc-camel-on-click=\"{{ sort.cva }}\" title=\"Mean CVA biological sensitivity (1-4)\" style=\"text-align:right;padding:12px 14px;border-bottom:1px solid #e6edef;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#5b6e75;cursor:pointer;\">CVA {{ sortMark.cva }}<\/sc-raw-th>\n                <sc-raw-th sc-camel-on-click=\"{{ sort.landings }}\" style=\"text-align:right;padding:12px 14px;border-bottom:1px solid #e6edef;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#5b6e75;cursor:pointer;\">Landings r {{ sortMark.landings }}<\/sc-raw-th>\n                <sc-raw-th style=\"text-align:left;padding:12px 14px;border-bottom:1px solid #e6edef;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#5b6e75;\">Signal<\/sc-raw-th>\n                <sc-raw-th sc-camel-on-click=\"{{ sort.value }}\" style=\"text-align:right;padding:12px 14px;border-bottom:1px solid #e6edef;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#5b6e75;cursor:pointer;\">Value r {{ sortMark.value }}<\/sc-raw-th>\n                <sc-raw-th sc-camel-on-click=\"{{ sort.price }}\" style=\"text-align:right;padding:12px 14px;border-bottom:1px solid #e6edef;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#5b6e75;cursor:pointer;\">Price r {{ sortMark.price }}<\/sc-raw-th>\n              <\/sc-raw-tr>\n            <\/sc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ tableRows }}\" as=\"row\" hint-placeholder-count=\"12\">\n                <sc-raw-tr style=\"{{ row.rowStyle }}\">\n                  <sc-raw-td style=\"padding:10px 14px;border-bottom:1px solid #f0f4f5;font-weight:500;\">{{ row.name }}<\/sc-raw-td>\n                  <sc-raw-td style=\"padding:10px 14px;border-bottom:1px solid #f0f4f5;text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;color:#5b6e75;\">{{ row.lag }}<\/sc-raw-td>\n                  <sc-raw-td style=\"padding:10px 14px;border-bottom:1px solid #f0f4f5;text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;color:{{ row.rColor }};font-weight:600;\">{{ row.r }}<\/sc-raw-td>\n                  <sc-raw-td style=\"padding:10px 14px;border-bottom:1px solid #f0f4f5;\"><span style=\"{{ row.tagStyle }}\">{{ row.tagText }}<\/span><\/sc-raw-td>\n                  <sc-raw-td style=\"padding:10px 14px;border-bottom:1px solid #f0f4f5;text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;color:#3d545e;\">{{ row.vR }}<\/sc-raw-td>\n                  <sc-raw-td style=\"padding:10px 14px;border-bottom:1px solid #f0f4f5;text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;color:#3d545e;\">{{ row.pR }}<\/sc-raw-td>\n                  <sc-raw-td sc-camel-on-click=\"{{ row.onPick }}\" title=\"Load this species above\" style=\"padding:10px 14px;border-bottom:1px solid #f0f4f5;text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;cursor:pointer;font-weight:{{ row.cvaWeight }};color:{{ row.cvaColor }};\">{{ row.cva }}<\/sc-raw-td>\n                <\/sc-raw-tr>\n              <\/sc-for>\n            <\/sc-raw-tbody>\n          <\/sc-raw-table>\n        <\/div>\n      <\/div>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5b6e75;margin-top:10px;\">{{ tableCount }}<\/div>\n    <\/div>\n  <\/section>\n\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  _mouseX = 0.5;\n  _cleanups = [];\n  SPCOLOR = { 'Crab, Dungeness': '#8a5cc4', 'Lingcod': '#d08c1f', 'Halibut, California': '#b04a6a', 'Squid, market': '#2b9e8c' };\n  state = { lag: 4, heroName: 'Crab, Dungeness', scrollLag: 0, rankMode: 'top20', query: '', sortKey: 'landings', sortDir: 'desc', ready: false, compareSel: ['Crab, Dungeness', 'Lingcod', 'Halibut, California', 'Squid, market'] };\n\n  componentDidMount() {\n    const boot = () => {\n      if (window.CFD) { this.setState({ ready: true }); }\n      else setTimeout(boot, 30);\n    };\n    boot();\n    this.onScroll = () => {\n      const el = this._sticky;\n      if (!el) return;\n      const rect = el.getBoundingClientRect();\n      const vh = window.innerHeight;\n      const total = rect.height - vh;\n      const p = total > 0 ? Math.min(1, Math.max(0, (-rect.top) / total)) : 0;\n      const lag = Math.round(p * 7);\n      if (lag !== this.state.scrollLag) this.setState({ scrollLag: lag });\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    window.addEventListener('resize', this.onScroll, { passive: true });\n    this.onScroll();\n    this.onMouse = e => { this._mouseX = (e.clientX || 0) / window.innerWidth; };\n    window.addEventListener('mousemove', this.onMouse, { passive: true });\n  }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.onScroll);\n    window.removeEventListener('resize', this.onScroll);\n    window.removeEventListener('mousemove', this.onMouse);\n    (this._cleanups || []).forEach(fn => fn());\n  }\n\n  // ==================== OCEAN CANVAS ENGINE ====================\n  mountOcean(canvas, opts) {\n    if (!canvas || canvas._mounted) return;\n    canvas._mounted = true;\n    const self = this;\n    const KEYS = [\n      { t:0.0, skyTop:[38,44,86], skyHor:[247,176,128], sun:[255,238,206], glow:[255,178,120], wFar:[176,150,150], wNear:[34,62,84], foam:[255,244,234], sunH:0.10, glit:0.7, star:0 },\n      { t:0.28, skyTop:[64,134,206], skyHor:[188,222,236], sun:[255,255,246], glow:[255,250,224], wFar:[120,186,196], wNear:[20,92,114], foam:[255,255,255], sunH:0.55, glit:0.5, star:0 },\n      { t:0.5, skyTop:[58,142,214], skyHor:[176,216,230], sun:[255,255,248], glow:[255,252,232], wFar:[96,178,188], wNear:[16,96,120], foam:[255,255,255], sunH:0.92, glit:0.45, star:0 },\n      { t:0.68, skyTop:[74,92,156], skyHor:[255,202,120], sun:[255,236,194], glow:[255,168,92], wFar:[206,164,118], wNear:[34,78,98], foam:[255,244,228], sunH:0.30, glit:0.95, star:0 },\n      { t:0.84, skyTop:[48,38,86], skyHor:[255,108,68], sun:[255,206,148], glow:[255,92,58], wFar:[188,98,84], wNear:[30,42,72], foam:[255,222,200], sunH:0.06, glit:1.0, star:0.15 },\n      { t:1.0, skyTop:[8,12,30], skyHor:[34,44,82], sun:[228,234,255], glow:[140,164,216], wFar:[28,42,76], wNear:[6,16,32], foam:[196,208,234], sunH:0.55, glit:0.55, star:1 }\n    ];\n    const lerp = (a,b,t) => a+(b-a)*t;\n    const lerpRGB = (a,b,t) => [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];\n    const rgb = (c,a) => 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a==null?1:a)+')';\n    const pal = t => {\n      let i=0; while(i<KEYS.length-1 && t>KEYS[i+1].t) i++;\n      const a=KEYS[i], b=KEYS[Math.min(i+1,KEYS.length-1)];\n      const k=Math.max(0,Math.min(1,(t-a.t)/((b.t-a.t)||1)));\n      return { skyTop:lerpRGB(a.skyTop,b.skyTop,k), skyHor:lerpRGB(a.skyHor,b.skyHor,k), sun:lerpRGB(a.sun,b.sun,k), glow:lerpRGB(a.glow,b.glow,k), wFar:lerpRGB(a.wFar,b.wFar,k), wNear:lerpRGB(a.wNear,b.wNear,k), foam:lerpRGB(a.foam,b.foam,k), sunH:lerp(a.sunH,b.sunH,k), glit:lerp(a.glit,b.glit,k), star:lerp(a.star,b.star,k) };\n    };\n    const ctx = canvas.getContext('2d');\n    let W,H,DPR,horizonY,oceanH;\n    const resize = () => {\n      DPR = Math.min(window.devicePixelRatio||1,2);\n      W = canvas.clientWidth||canvas.offsetWidth||300; H = canvas.clientHeight||300;\n      canvas.width=W*DPR; canvas.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);\n      horizonY=H*opts.horizon; oceanH=H-horizonY;\n    };\n    const ro = new ResizeObserver(resize); ro.observe(canvas); resize();\n    const stars = Array.from({length:120},()=>({x:Math.random(),y:Math.random()*0.42,r:Math.random()*1.2+0.3,tw:Math.random()*6.28}));\n    // persistent, coherent sun-glints (twinkle over time instead of re-randomizing each frame)\n    const glints = Array.from({length:90},()=>{ const dy=Math.pow(Math.random(),1.3); return { dy, off:(Math.random()-0.5)*2, len:1+Math.random()*3, tw:Math.random()*6.28, sp:0.6+Math.random()*1.1, drift:(Math.random()-0.5)*0.15 }; });\n    let T=0, cur=opts.getTOD();\n    let raf;\n    const draw = () => {\n      T+=0.0064;\n      const target=opts.getTOD(); cur+=(target-cur)*0.06;\n      const P=pal(cur);\n      const sunX=W*(0.5+(self._mouseX-0.5)*0.22);\n      const sunY=horizonY-P.sunH*horizonY*0.82;\n      const sky=ctx.createLinearGradient(0,0,0,horizonY+oceanH*0.1);\n      sky.addColorStop(0,rgb(P.skyTop)); sky.addColorStop(0.7,rgb(lerpRGB(P.skyTop,P.skyHor,0.55))); sky.addColorStop(1,rgb(P.skyHor));\n      ctx.fillStyle=sky; ctx.fillRect(0,0,W,horizonY+2);\n      if(P.star>0.01) stars.forEach(s=>{ const tw=0.5+0.5*Math.sin(T*2+s.tw); ctx.fillStyle=rgb([255,255,255],P.star*tw*0.9); ctx.beginPath(); ctx.arc(s.x*W,s.y*horizonY,s.r,0,6.283); ctx.fill(); });\n      const glowR=Math.min(W,H)*0.6;\n      const g=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,glowR);\n      g.addColorStop(0,rgb(P.glow,0.55)); g.addColorStop(0.25,rgb(P.glow,0.22)); g.addColorStop(1,rgb(P.glow,0));\n      ctx.fillStyle=g; ctx.fillRect(0,0,W,horizonY+oceanH*0.4);\n      const sunR=Math.min(W,H)*0.05;\n      const sd=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,sunR);\n      sd.addColorStop(0,rgb(P.sun,1)); sd.addColorStop(0.7,rgb(P.sun,0.95)); sd.addColorStop(1,rgb(P.sun,0.2));\n      ctx.fillStyle=sd; ctx.beginPath(); ctx.arc(sunX,sunY,sunR,0,6.283); ctx.fill();\n      const haze=ctx.createLinearGradient(0,horizonY-40,0,horizonY+40);\n      haze.addColorStop(0,rgb(P.skyHor,0)); haze.addColorStop(0.5,rgb(P.skyHor,0.45)); haze.addColorStop(1,rgb(P.wFar,0));\n      ctx.fillStyle=haze; ctx.fillRect(0,horizonY-40,W,80);\n      // reflected sun column on the water (mirror-like reflectivity)\n      const refW=Math.max(24,Math.min(W,H)*0.14);\n      const refG=ctx.createLinearGradient(0,horizonY,0,H);\n      refG.addColorStop(0,rgb(P.sun,0.55)); refG.addColorStop(0.5,rgb(P.glow,0.22)); refG.addColorStop(1,rgb(P.glow,0));\n      ctx.save(); ctx.globalCompositeOperation='lighter';\n      ctx.beginPath();\n      ctx.moveTo(sunX-refW*0.35,horizonY);\n      ctx.lineTo(sunX+refW*0.35,horizonY);\n      ctx.lineTo(sunX+refW,H);\n      ctx.lineTo(sunX-refW,H);\n      ctx.closePath(); ctx.fillStyle=refG; ctx.fill();\n      ctx.restore();\n      const NUM=22;\n      for(let i=0;i<NUM;i++){\n        const depth=i/(NUM-1);\n        const yTop=horizonY+Math.pow(depth,1.9)*oceanH;\n        const amp=lerp(0.6,26,depth), wlen=lerp(46,320,depth), speed=lerp(0.25,0.9,depth);\n        const phase=T*speed+i*0.9, col=lerpRGB(P.wFar,P.wNear,depth);\n        ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,yTop+Math.sin(phase)*amp);\n        for(let x=0;x<=W;x+=8){ const y=yTop+Math.sin(x/wlen+phase)*amp+Math.sin(x/(wlen*0.4)+phase*1.6)*amp*0.3; ctx.lineTo(x,y); }\n        ctx.lineTo(W,H); ctx.closePath(); ctx.fillStyle=rgb(col); ctx.fill();\n        ctx.lineWidth=lerp(0.6,2,depth); ctx.beginPath(); let st=false;\n        for(let x=0;x<=W;x+=8){ const y=yTop+Math.sin(x/wlen+phase)*amp+Math.sin(x/(wlen*0.4)+phase*1.6)*amp*0.3; st?ctx.lineTo(x,y):(ctx.moveTo(x,y),st=true); }\n        ctx.strokeStyle=rgb(lerpRGB(col,P.sun,0.7),lerp(0.12,0.5,depth)); ctx.stroke();\n        // specular sheen: a brighter mirror stroke near the sun column\n        ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineWidth=lerp(0.4,1.6,depth); ctx.beginPath(); let ss=false;\n        for(let x=0;x<=W;x+=8){ const df=1-Math.min(1,Math.abs(x-sunX)/(W*0.32)); if(df<=0){ss=false;continue;} const y=yTop+Math.sin(x/wlen+phase)*amp+Math.sin(x/(wlen*0.4)+phase*1.6)*amp*0.3; ss?ctx.lineTo(x,y):(ctx.moveTo(x,y),ss=true); }\n        ctx.strokeStyle=rgb(P.sun,lerp(0.06,0.32,depth)); ctx.stroke(); ctx.restore();\n        if(depth>0.62){ const fa=(depth-0.62)/0.38;\n          for(let x=0;x<=W;x+=10){ const y=yTop+Math.sin(x/wlen+phase)*amp+Math.sin(x/(wlen*0.4)+phase*1.6)*amp*0.3; const cr=Math.sin(x/wlen+phase); if(cr>0.55&&Math.random()>0.5){ ctx.fillStyle=rgb(P.foam,fa*(0.15+Math.random()*0.3)); ctx.fillRect(x+(Math.random()-0.5)*6,y-Math.random()*3,1.5+Math.random()*2.5,1.5+Math.random()*2); } } }\n      }\n      ctx.save(); ctx.globalCompositeOperation='lighter';\n      for(const gl of glints){ const y=horizonY+gl.dy*oceanH; const spread=lerp(6,W*0.3,gl.dy); const x=sunX+(gl.off+Math.sin(T*gl.drift+gl.tw)*0.15)*spread; const df=1-Math.min(1,Math.abs(x-sunX)/(spread+1)); if(df<=0)continue; const tw=0.35+0.65*(0.5+0.5*Math.sin(T*gl.sp+gl.tw)); const a=df*df*0.42*P.glit*tw;     }\n    }\n    return e('svg', { viewBox: '0 0 ' + w + ' ' + h, width: '100%', style: { display: 'block', height: 'auto' }, role: 'img', 'aria-label': 'Catch versus ocean over time' }, kids);\n  }\n\n  buildSpark(sp) {\n    const e = React.createElement;\n    const w = 210, h = 46, series = sp.landings, years = window.CFD.years, n = years.length;\n    let M = 1.5; for (const v of series) if (v != null && Math.abs(v) > M) M = Math.abs(v);\n    const x = i => 2 + (i / (n - 1)) * (w - 4);\n    const y = z => 3 + (1 - (z + M) / (2 * M)) * (h - 6);\n    let d = '', started = false;\n    for (let i = 0; i < n; i++) { const v = series[i]; if (v == null) { started = false; continue; } d += (started ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; started = true; }\n    const col = sp._assoc === 'warm' ? '#c0392b' : '#3f6fa3';\n    return e('svg', { viewBox: '0 0 ' + w + ' ' + h, width: '100%', style: { display: 'block', height: 'auto' }, role: 'img', 'aria-label': 'catch trend' }, [\n      e('line', { key: 'z', x1: 2, x2: w - 2, y1: y(0), y2: y(0), stroke: '#e2e9eb', strokeWidth: 1 }),\n      e('path', { key: 'l', d, fill: 'none', stroke: col, strokeWidth: 2, strokeLinejoin: 'round', strokeLinecap: 'round' })\n    ]);\n  }\n\n  buildRanking(rows, mode) {\n    const e = React.createElement;\n    const list = mode === 'all' ? rows : rows.slice(0, 20);\n    const spotlights = new Set(window.CFD.featured || []);\n    const rowH = mode === 'all' ? 15 : 26;\n    const labelW = 168, valW = 46, m = { l: labelW, r: valW, t: 6, b: 6 };\n    const w = 860, h = list.length * rowH + m.t + m.b;\n    const pw = w - m.l - m.r;\n    const maxR = Math.max.apply(null, rows.map(r => Math.abs(r.r)));\n    const bw = r => (Math.abs(r) / maxR) * pw;\n    const kids = [];\n    list.forEach((r, i) => {\n      const yy = m.t + i * rowH;\n      const spot = spotlights.has(r.name);\n      const col = r.assoc === 'Warm-water' ? '#c0392b' : '#3f6fa3';\n      kids.push(e('rect', { key: 'b Ref: el => { this._trawlCount = el; },\n      onTrawlReset: () => { if (this._trawlReset) this._trawlReset(); } };\n\n    const S = D.spotlights;\n    const heroSp = S[this.state.heroName];\n    const lag = this.state.lag;\n\n    // hero interactive\n    const heroCorr = heroSp.corr.landings.r[lag];\n    const heroRaw = this.rawSummary(heroSp);\n    const heroCva = this.cvaOf(this.state.heroName);\n    const bPts = [];\n    Object.keys(D.cva || {}).forEach(nm => {\n      const s = D.spotlights[nm]; if (!s) return;\n      const bl = this.bestLagOf(s.corr.landings.r);\n      if (bl.r != null) bPts.push([D.cva[nm].sens, Math.abs(bl.r)]);\n    });\n    const benchFit = bPts.length > 2 ? this.pearson(bPts.map(p => p[0]), bPts.map(p => p[1])) : { r: null, n: bPts.length };\n    const heroLabel = this.state.heroName.split(',')[0];\n    // species buttons\n    const btnStyle = active => 'border:1px solid ' + (active ? '#7fb0c4' : '#274049') + ';background:' + (active ? '#1b3a46' : 'transparent') + ';color:' + (active ? '#fff' : '#9db8c2') + ';border-radius:999px;padding:8px 16px;font:500 14px \\'Public Sans\\',sans-serif;cursor:pointer;';\n    const species = D.featured.map(name => ({\n      label: name.split(',')[0],\n      active: name === this.state.heroName,\n      style: btnStyle(name === this.state.heroName),\n      onClick: () => this.setState({ heroName: name })\n    }));\n\n    // sticky (anchovy)\n    const anch = S['Anchovy, northern'];\n    const sLag = this.state.scrollLag;\n    const sR = anch.corr.landings.r[sLag];\n    let peakLag = 0; anch.corr.landings.r.forEach((v, i) => { if (Math.abs(v) > Math.abs(anch.corr.landings.r[peakLag])) peakLag = i; });\n\n    // spotlights cards\n    const blurbs = {\n      'Crab, Dungeness': 'A prized cold-water fishery and the most climate-sensitive species the experts scored here. Its larvae are especially vulnerable to a warming, more acidic ocean, and the catch tracks conditions about five years earlier.',\n      'Lingcod': 'A rocky-reef predator that leans warm, with its strongest response about three years out. Federally managed, so it carries no California state vulnerability score \\u2014 and its landings fell sharply under groundfish rebuilding rules, a reminder that regulation moves this line too.',\n      'Halibut, California': 'A warm-water flatfish of sandy bottoms and bays. Strong seasons tend to follow warm water roughly five years earlier, close to the time it needs to reach legal size, even though experts rated it among the least biologically sensitive of the assessed species.',\n      'Squid, market': \"California's largest fishery by volume, and the quickest responder here. Cool, productive conditions just a year earlier tend to precede strong seasons.\"\n    };\n    const shorts = { 'Crab, Dungeness': 'Dungeness crab', 'Lingcod': 'Lingcod', 'Halibut, California': 'California halibut', 'Squid, market': 'Market squid' };\n    const spots = D.featured.map(name => {\n      const sp = S[name];\n      const r = sp.corr.landings.r;\n      let bi = 0; r.forEach((v, i) => { if (Math.abs(v) > Math.abs(r[bi])) bi = i; });\n      const warm = r[bi] >= 0;\n      sp._assoc = warm ? 'warm' : 'cold';\n      const tagStyle = 'display:inline-block;font:600 10.5px \\'IBM Plex Mono\\',monospace;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid ' + (warm ? '#c0392b' : '#3f6fa3') + ';color:' + (warm ? '#c0392b' : '#3f6fa3') + ';background:' + (warm ? 'rgba(192,57,43,.07)' : 'rgba(63,111,163,.07)') + ';';\n      return {\n        short: shorts[name] || name, sci: sp.profile ? sp.profile.sci : '', lag: bi,\n        r: this.fmtR(r[bi]), rColor: this.rColor(r[bi]),\n        tagText: warm ? 'warm-water' : 'cold-water', tagStyle,\n        blurb: blurbs[name] || '', spark: this.buildSpark(sp)\n      };\n    });\n\n    // table\n    const dir = this.state.sortDir, key = this.state.sortKey;\n    let rows = D.table.filter(t => t.landings).map(t => ({ false, h: 340 }),\n      // sticky\n      stickLag: sLag, stickR: this.fmtR(sR), stickRColor: this.rColor(sR),\n      stickDesc: sLag === 0 ? 'Same year: the ocean and the catch have little to say to each other.' : \"This year's catch set beside the ocean \" + sLag + ' year' + (sLag === 1 ? '' : 's') + ' earlier.',\n      stickPeak: sLag === peakLag,\n      stickyChart: this.buildTimeChart(anch, sLag, { dark: false, h: 320 }),\n      // spotlights\n      spots,\n      // ranking\n      rankChart: this.buildRanking(D.ranking, this.state.rankMode),\n      // compare\n      compareChips: D.featured.map(nm => {\n        const on = this.state.compareSel.includes(nm);\n        return {\n          label: nm.split(',')[0], dot: this.SPCOLOR[nm] || this.autoColor(nm), dotOpacity: on ? 1 : 0.3,\n          style: 'border:1px solid ' + (on ? (this.SPCOLOR[nm] || this.autoColor(nm)) : '#cdd8db') + ';background:' + (on ? '#fff' : '#eef3f4') + ';color:' + (on ? '#10222b' : '#8a9aa0') + ';border-radius:999px;padding:8px 15px 8px 13px;font:500 14px \\'Public Sans\\',sans-serif;cursor:pointer;',\n          onClick: () => this.setState(s => ({ compareSel: s.compareSel.includes(nm) ? s.compareSel.filter(x => x !== nm) : [...s.compareSel, nm] }))\n        };\n      }),\n      compareChart: this.buildLagCompare(this.state.compareSel.filter(nm => D.spotlights[nm])),\n      tableRows,\n      tableCount: (q ? tableRows.length + ' of 76 species' : '76 species · sorted by ' + key + ' (' + (dir === 'desc' ? 'high→low' : 'low→high') + ')'),\n      sort: { name: setSort('name'), lag: setSort('lag'), landings: setSort('landings'), value: setSort('value'), price: setSort('price'), cva: setSort('cva') },\n      sortMark: { name: mark('name'), lag: mark('lag'), landings: mark('landings'), value: mark('value'), price: mark('price'), cva: mark('cva') },\n      // refs\n      stickyRef: el => { this._sticky = el; },\n      heroOceanRef: el => { if (el) this.mountOcean(el, { horizon: 0.42, getTOD: () =>
